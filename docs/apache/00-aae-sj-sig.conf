# SJ-SIG: LAN por IP en puerto propio. No usa :80 (Armory = 172.16.16.70).
# Copiar a C:\laragon\etc\apache2\sites-enabled\00-aae-sj-sig.conf
Listen 8086

<VirtualHost *:8086>
    ServerName sj-sig-lan

    DocumentRoot "C:/laragon/www/SJ-SIG/public"

    <Directory "C:/laragon/www/SJ-SIG/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName sj-sig.test
    ServerAlias *.sj-sig.test

    DocumentRoot "C:/laragon/www/SJ-SIG/public"

    <Directory "C:/laragon/www/SJ-SIG/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName sj-sig.test
    ServerAlias *.sj-sig.test

    DocumentRoot "C:/laragon/www/SJ-SIG/public"

    <Directory "C:/laragon/www/SJ-SIG/public">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>
