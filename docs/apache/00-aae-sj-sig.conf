# SJ-SIG: acceso LAN en puerto propio (no usa :80; Armory puede quedar en esa IP).
# Copiar a C:\laragon\etc\apache2\sites-enabled\00-aae-sj-sig.conf y recargar Apache.
#
# Escucha en todas las interfaces (0.0.0.0) para que cualquier equipo de la red
# entre con http://<IP-del-servidor>:8086/ingreso

Listen 0.0.0.0:8086

<VirtualHost *:8086>
    ServerName sj-sig-lan
    ServerAlias *

    DocumentRoot "C:/laragon/www/SJ-SIG/public"

    <Directory "C:/laragon/www/SJ-SIG/public">
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog "logs/sj-sig-8086-error.log"
    CustomLog "logs/sj-sig-8086-access.log" common
</VirtualHost>

<VirtualHost *:80>
    ServerName sj-sig.test
    ServerAlias *.sj-sig.test

    DocumentRoot "C:/laragon/www/SJ-SIG/public"

    <Directory "C:/laragon/www/SJ-SIG/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName sj-sig.test
    ServerAlias *.sj-sig.test

    DocumentRoot "C:/laragon/www/SJ-SIG/public"

    <Directory "C:/laragon/www/SJ-SIG/public">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>
